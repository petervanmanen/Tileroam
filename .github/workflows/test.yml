name: Tests

# Runs on pull requests only. The merge to main isn't tested again here: the TestFlight workflow
# runs the same tests on the tagged commit before it uploads, so a release is tested twice (the
# PR, then the exact build), not three times.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 27.0
        run: sudo xcode-select -s /Applications/Xcode_27.app

      - name: Run tests
        shell: bash
        run: |
          mkdir -p build
          xcodebuild test \
            -project Tileroam.xcodeproj -scheme Tileroam \
            -destination 'platform=iOS Simulator,OS=27.0,name=iPhone 18 Pro' \
            -derivedDataPath build -resultBundlePath build/Tests.xcresult \
            2>&1 | tee build/test.log | grep -E "error:|✘|Test case .* failed|TEST SUCCEEDED|TEST FAILED"

      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            build/Tests.xcresult
            build/test.log
